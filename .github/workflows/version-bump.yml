name: Bump Package Version

# Increment the patch version on every push to a deploy branch and commit it
# back. GitHub does not emit a new `push` event for commits pushed with the
# workflow's own GITHUB_TOKEN (loop prevention), so this bump does not re-trigger
# itself; the `[skip ci]` marker and head-commit guard are belt-and-suspenders.
on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

# Serialize bumps per branch so two quick pushes produce one bump each rather
# than racing on the same working tree.
concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Increment patch version
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment patch version
        run: npm version patch --no-git-tag-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version change to commit; nothing to do."
            exit 0
          fi
          git commit -m "chore: bump version to v${VERSION} [skip ci]"
          git push